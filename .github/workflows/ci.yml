name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: npm

      - name: Set up Bun test runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5

      # Node 26.13.1 ships npm 11.20.0; package.json pins npm 12.2.3.
      - name: Install npm
        run: npm install --global npm@12.2.3

      - name: Verify toolchain and SDK artifact
        run: |
          test "$(node --version)" = "v26.13.1"
          test "$(npm --version)" = "12.2.3"
          test "$(bun --version)" = "1.4.5"
          npm run provenance:check

      - name: Install frozen dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint:check

      - name: Test
        run: npm test

      # `npm run build` prerenders with React in Node (scripts/prerender.mjs
      # imports dist-ssr/entry-server.js), so no browser binary is needed here.
      # Playwright is only used by the e2e/ harnesses, which CI does not run.
      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high
