<!doctype html>
<html

  class="h-full bg-white lg:bg-zinc-100 dark:bg-black dark:lg:bg-zinc-950"
>

    <link rel="icon" type="image/svg+xml" href="/logo-cat.svg" />

      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta
      name="theme-color"

      content="#fff"
