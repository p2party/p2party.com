<!doctype html>
<html
  lang="en"
  class="h-full bg-white lg:bg-zinc-100 dark:bg-black dark:lg:bg-zinc-950"
>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-cat.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="referrer" content="no-referrer" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#fff"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#000"
    />

    <meta
      name="description"
      content="Messaging and file sharing with secrecy."
    />
    <meta
      name="keywords"
      content="p2p, crypto, cryptography, e2e, encryption, webrtc, peer-to-peer, chat, room, indexeddb, RTCDataChannel, RTCPeerConnection, privacy, security, torrent, file-sharing"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://p2party.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="p2party" />
    <meta property="og:url" content="https://p2party.com/" />
    <meta property="og:title" content="p2party" />
    <meta
      property="og:description"
      content="Messaging and file sharing with secrecy."
    />
    <meta property="og:image" content="https://p2party.com/logo-cat.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="P2Party" />
    <meta
      name="twitter:description"
      content="Messaging and file sharing with secrecy."
    />
    <meta name="twitter:image" content="https://p2party.com/logo-cat.svg" />

    <title>P2Party is an encrypted WebRTC mesh network generator</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "p2party",
        "url": "https://p2party.com/",
        "applicationCategory": "CommunicationApplication",
        "operatingSystem": "Any browser with WebRTC and WebAssembly",
        "description": "End-to-end encrypted messaging and file transfer over a peer-to-peer WebRTC mesh. No accounts, no cloud storage; the signaling service introduces peers but never carries their messages.",
        "license": "https://www.gnu.org/licenses/agpl-3.0.html",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
        "codeRepository": "https://github.com/p2party/p2party.com"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
