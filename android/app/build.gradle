apply plugin: 'com.android.application'

android {
    namespace = "com.p2party.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.p2party.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// The web client inside the APK is the copy `npx cap sync` left in
// src/main/assets/public. Git ignores that copy, so a build can package an old
// one. Refuse a copy that loads a different SDK than package.json vendors, or
// one built without the app's Content-Security-Policy (`npm run build:native`).
def checkBundledWebClient = tasks.register('checkBundledWebClient') {
    def packageJson = rootProject.file('../package.json')
    def bundle = file('src/main/assets/public')
    doLast {
        def fix = 'Run `npm run build:native && npx cap sync android`, then build again.'
        def dependency = new groovy.json.JsonSlurper().parse(packageJson).dependencies?.p2party ?: ''
        def vendored = dependency =~ /^file:vendor\/p2party-([0-9][^\/]*)\.tgz$/
        if (!vendored.find()) {
            throw new GradleException("package.json does not vendor p2party as file:vendor/p2party-<version>.tgz")
        }
        def expected = vendored.group(1)
        def loaded = [] as SortedSet
        fileTree(dir: new File(bundle, 'assets'), include: '*.js').each { script ->
            (script.text =~ /vendor\/p2party-([0-9][0-9A-Za-z.+-]*)\//).each { match -> loaded << match[1] }
        }
        if (loaded != ([expected] as SortedSet)) {
            throw new GradleException("The bundled web client loads p2party ${loaded ? loaded.join(', ') : 'from no vendor path'}, but package.json vendors ${expected}. ${fix}")
        }
        def index = new File(bundle, 'index.html')
        if (!index.isFile() || !index.text.contains('http-equiv="Content-Security-Policy"')) {
            throw new GradleException("The bundled web client has no Content-Security-Policy meta element, so it was not built for the app. ${fix}")
        }
    }
}
tasks.named('preBuild') { dependsOn checkBundledWebClient }

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
