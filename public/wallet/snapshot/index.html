<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' https://signaling.p2party.com; img-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>Testnet 1 balance refresh · P2Party</title>
    <link rel="icon" href="/logo-cat-tight.svg" />
    <link rel="stylesheet" href="./page.css" />
  </head>
  <body>
    <main>
      <header>
        <img src="/logo-cat-tight.svg" alt="" width="36" height="36" />P2Party
      </header>
      <h1>Refresh testnet balances</h1>
      <p>
        This page reads the same public ledger for every wallet. Your wallet
        matches its receive requests on your device.
      </p>
      <p role="status" id="status">Reading Testnet 1…</p>
      <button id="retry" hidden>Try again</button>
      <a id="download" download="p2party-testnet1-snapshot.json" hidden
        >Download public snapshot</a
      >
    </main>
    <script type="module" src="./page.mjs"></script>
  </body>
</html>
