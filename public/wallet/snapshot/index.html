<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' https://signaling.p2party.com; img-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>Check for payments · P2Party</title>
    <link rel="icon" href="/logo-cat-tight.svg" />
    <link rel="stylesheet" href="./page.css" />
  </head>
  <body>
    <header>
      <a href="/" aria-label="p2party home">
        <img
          src="/logo-cat-tight.svg"
          alt=""
          width="36"
          height="36"
        />p2party</a
      >
    </header>
    <main>
      <h1>Check for payments</h1>
      <p>
        This window reads the public Testnet 1 history. Your wallet checks it on
        your device to find payments.
      </p>
      <p role="status" id="status">Checking Testnet 1…</p>
      <button id="retry" hidden>Try again</button>
      <a id="download" download="p2party-testnet1-snapshot.json" hidden
        >Download public history</a
      >
      <p><a class="back-link" href="/wallet/">Wallet help</a></p>
    </main>
    <script type="module" src="./page.mjs"></script>
  </body>
</html>
